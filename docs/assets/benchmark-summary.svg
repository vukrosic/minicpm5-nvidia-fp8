<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">MiniCPM5-1B RTX 3060 speed and quality benchmark</title>
<desc id="desc">Block FP8 decodes 1.503 times faster than BF16. HumanEval Plus gains one task, while a frozen 200-task cross-domain suite loses two tasks overall, with the largest drop on IFEval.</desc>
<style>
:root{color-scheme:light dark}
.bg{fill:#ffffff}.panel{fill:#f8fafc;stroke:#d1d5db}.text{fill:#111827}.muted{fill:#4b5563}.grid{stroke:#d1d5db}.bf16{fill:#6b7280;stroke:#6b7280}.fp8{fill:#2563eb;stroke:#2563eb}.track{fill:#e5e7eb}.link{stroke:#9ca3af}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400}.title{font-size:32px;font-weight:600}.subtitle{font-size:16px}.panel-title{font-size:20px;font-weight:600}.label{font-size:15px}.value{font-size:14px;font-weight:600}.note{font-size:14px}
@media(prefers-color-scheme:dark){.bg{fill:#0b0f17}.panel{fill:#111827;stroke:#374151}.text{fill:#f3f4f6}.muted{fill:#cbd5e1}.grid{stroke:#374151}.bf16{fill:#9ca3af;stroke:#9ca3af}.fp8{fill:#60a5fa;stroke:#60a5fa}.track{fill:#273244}.link{stroke:#6b7280}}
</style>
<rect class="bg" width="1200" height="720"/>
<text class="text title" x="50" y="58">MiniCPM5-1B on RTX 3060: speed vs quality</text>
<text class="muted subtitle" x="50" y="88">One active request · batch 1 · vLLM 0.27.1 · deterministic no-thinking evaluation</text>
<rect class="panel" x="50" y="120" width="500" height="430" rx="12"/>
<rect class="panel" x="590" y="120" width="560" height="430" rx="12"/>
<text class="text panel-title" x="78" y="162">Single-request decode throughput</text>
<text class="muted note" x="78" y="187">Higher is faster · output tokens per second</text>
<text class="text label" x="78" y="286">BF16 reference</text>
<rect class="track" x="205" y="263" width="300" height="30" rx="5"/>
<rect class="bf16" x="205" y="263" width="184.9" height="30" rx="5"/>
<text class="text value" x="381.9" y="284" text-anchor="end">165.39</text>
<text class="muted value" x="515" y="284" text-anchor="end">1.000×</text>
<text class="text label" x="78" y="406">Block FP8</text>
<rect class="track" x="205" y="383" width="300" height="30" rx="5"/>
<rect class="fp8" x="205" y="383" width="277.8" height="30" rx="5"/>
<text class="text value" x="448.0" y="404" text-anchor="end">248.52</text>
<text class="muted value" x="515" y="404" text-anchor="end">1.503×</text>
<text class="text panel-title" x="620" y="162">Matched benchmark scores</text>
<text class="muted note" x="620" y="187">Percentage correct · same tasks and deterministic decoding</text>
<line class="grid" x1="760.0" y1="205" x2="760.0" y2="480"/>
<text class="muted note" x="760.0" y="505" text-anchor="middle">0%</text>
<line class="grid" x1="843.8" y1="205" x2="843.8" y2="480"/>
<text class="muted note" x="843.8" y="505" text-anchor="middle">25%</text>
<line class="grid" x1="927.5" y1="205" x2="927.5" y2="480"/>
<text class="muted note" x="927.5" y="505" text-anchor="middle">50%</text>
<line class="grid" x1="1011.2" y1="205" x2="1011.2" y2="480"/>
<text class="muted note" x="1011.2" y="505" text-anchor="middle">75%</text>
<line class="grid" x1="1095.0" y1="205" x2="1095.0" y2="480"/>
<text class="muted note" x="1095.0" y="505" text-anchor="middle">100%</text>
<text class="text label" x="620" y="235">HumanEval+</text>
<line class="link" x1="954.1" y1="230" x2="956.1" y2="230" stroke-width="3"/>
<circle class="bf16" cx="954.1" cy="230" r="7"/>
<circle class="fp8" cx="956.1" cy="230" r="7"/>
<text class="text value" x="1122" y="235" text-anchor="end">95/164 → 96/164</text>
<text class="text label" x="620" y="289">GSM8K</text>
<line class="link" x1="880.6" y1="284" x2="887.3" y2="284" stroke-width="3"/>
<circle class="bf16" cx="887.3" cy="284" r="7"/>
<circle class="fp8" cx="880.6" cy="284" r="7"/>
<text class="text value" x="1122" y="289" text-anchor="end">19/50 → 18/50</text>
<text class="text label" x="620" y="343">MMLU</text>
<line class="link" x1="867.2" y1="338" x2="880.6" y2="338" stroke-width="3"/>
<circle class="bf16" cx="867.2" cy="338" r="7"/>
<circle class="fp8" cx="880.6" cy="338" r="7"/>
<text class="text value" x="1122" y="343" text-anchor="end">16/50 → 18/50</text>
<text class="text label" x="620" y="397">C-Eval</text>
<line class="link" x1="867.2" y1="392" x2="880.6" y2="392" stroke-width="3"/>
<circle class="bf16" cx="867.2" cy="392" r="7"/>
<circle class="fp8" cx="880.6" cy="392" r="7"/>
<text class="text value" x="1122" y="397" text-anchor="end">16/50 → 18/50</text>
<text class="text label" x="620" y="451">IFEval</text>
<line class="link" x1="981.1" y1="446" x2="1014.6" y2="446" stroke-width="3"/>
<circle class="bf16" cx="1014.6" cy="446" r="7"/>
<circle class="fp8" cx="981.1" cy="446" r="7"/>
<text class="text value" x="1122" y="451" text-anchor="end">38/50 → 33/50</text>
<circle class="bf16" cx="790" cy="532" r="6"/><text class="text note" x="804" y="537">BF16</text>
<circle class="fp8" cx="875" cy="532" r="6"/><text class="text note" x="889" y="537">Block FP8</text>
<text class="text value" x="50" y="595">FP8 result: 1.503× BF16 decode · HumanEval+ +1 task · cross-domain suite −2 tasks</text>
<text class="muted note" x="50" y="630">Cross-domain churn: 12 paired losses, 10 gains. Largest drop: IFEval 38/50 → 33/50.</text>
<text class="muted note" x="50" y="666">Scope: pinned MiniCPM5-1B checkpoint and one RTX 3060. The four 50-task slices are release screens, not full official leaderboard reproductions.</text>
</svg>
